[project]
name = "sentiment"
version = "0.1.0"
description = "IMDB movie review sentiment: a TF-IDF + logistic regression baseline against a small PyTorch CNN."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
]

[project.scripts]
sentiment = "sentiment.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# On Linux, install the CPU-only PyTorch wheel instead of the much larger CUDA build.
# The README shows how to swap in a CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
